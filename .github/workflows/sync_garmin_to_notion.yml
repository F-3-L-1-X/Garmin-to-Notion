name: Sync Garmin to Notion

on:
  schedule:
    - cron: '7/15 * * * *'
  workflow_dispatch:
    inputs:
      GARMIN_ACTIVITIES_FETCH_LIMIT:
        type: number
        default: 10
      SYNC_ACTIVITIES:
        description: Importer aussi les activités Garmin terminées pendant ce lancement manuel
        type: boolean
        default: true

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Préparer le site des bilans Garmin
        run: uv run python -c "from src.helpers.garmin_report import prepare_report_site; prepare_report_site()"
      - name: Envoyer les entraînements prévus sur la montre
        env:
          GARMIN_AUTH_TOKEN: ${{ secrets.GARMIN_AUTH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          GARMIN_WORKOUTS_LOOKAHEAD_DAYS: '14'
        run: uv run python -m src.workflows.notion-workouts
      - name: Synchroniser les activités Garmin
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.SYNC_ACTIVITIES }}
        env:
          GARMIN_AUTH_TOKEN: ${{ secrets.GARMIN_AUTH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          GARMIN_ACTIVITIES_FETCH_LIMIT: ${{ inputs.GARMIN_ACTIVITIES_FETCH_LIMIT || '10' }}
        run: uv run python -m src.workflows.garmin-activities
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer le site publié
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publier les bilans interactifs
        id: deployment
        uses: actions/deploy-pages@v4
